name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Fix Xcode project settings and file paths
        run: |
          sed -i '' '/Info.plist in Resources/d' PAKIN_EPIC.xcodeproj/project.pbxproj
          cp Core/*/*.swift Core/ 2>/dev/null || true
          cp Features/*/*.swift Features/ 2>/dev/null || true

      - name: Build Xcode Archive
        run: |
          xcodebuild -project PAKIN_EPIC.xcodeproj \
            -scheme PAKIN_EPIC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PAKIN_EPIC.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Unsigned IPA for GBOX
        run: |
          mkdir -p build/Payload
          cp -r build/PAKIN_EPIC.xcarchive/Products/Applications/PAKIN_EPIC.app build/Payload/
          cd build
          zip -r PAKIN_EPIC_CLOCK.ipa Payload
          cd ..

      - name: Upload IPA for Download
        uses: actions/upload-artifact@v4
        with:
          name: PAKIN_EPIC_CLOCK_IPA
          path: build/PAKIN_EPIC_CLOCK.ipa
          retention-days: 7
